name: Python CI Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ci_pipeline-main/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ci_pipeline-main/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd ci_pipeline-main
        pip install pytest pytest-cov flake8
        
    - name: Check Python syntax with Flake8
      run: |
        cd ci_pipeline-main
        flake8 app.py test_app.py --max-line-length=120 --ignore=E501,W503
        
    - name: Run tests with coverage
      run: |
        cd ci_pipeline-main
        python -m pytest test_app.py -v --cov=app --cov-report=term-missing --cov-report=xml
        
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: ci_pipeline-main/coverage.xml
        
    - name: Run security check (Bandit)
      run: |
        pip install bandit
        cd ci_pipeline-main
        bandit -r app.py || echo "Security check completed"
