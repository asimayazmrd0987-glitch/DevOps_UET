name: Node.js Docker CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Nodeapp-main/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Nodeapp-main/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Nodeapp-main/package-lock.json
        
    - name: Install dependencies
      run: |
        cd Nodeapp-main
        npm ci
        
    - name: Run linting
      run: |
        cd Nodeapp-main
        echo "Running ESLint (add eslint to package.json for real checks)"
        # npm run lint || true
        
    - name: Run basic tests
      run: |
        cd Nodeapp-main
        echo "Testing application structure..."
        test -f index.js && echo "✓ index.js exists"
        test -f package.json && echo "✓ package.json exists"
        test -f Dockerfile && echo "✓ Dockerfile exists"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
          
    - name: Build Docker image
      run: |
        cd Nodeapp-main
        docker build \
          --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
          --build-arg VCS_REF=${{ github.sha }} \
          -t nodeapp:${{ github.sha }} \
          -t nodeapp:latest \
          .
          
    - name: Scan Docker image for vulnerabilities
      uses: docker/scout-action@v1
      with:
        command: cves
        image: nodeapp:${{ github.sha }}
        only-severities: critical,high
        exit-code: false
        
    - name: Test Docker container
      run: |
        cd Nodeapp-main
        docker run -d --name test-container -p 3000:3000 nodeapp:${{ github.sha }}
        sleep 10
        echo "Checking if container is running..."
        docker ps | grep test-container
        echo "Testing HTTP response..."
        curl -f http://localhost:3000 || (docker logs test-container && exit 1)
        docker stop test-container
        docker rm test-container
        echo "✓ Container test passed"
        
    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Push Docker image to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cd Nodeapp-main
        docker tag nodeapp:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ github.sha }}
        docker tag nodeapp:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:latest
        echo "✓ Docker images pushed successfully"
        
    - name: Generate build report
      if: always()
      run: |
        echo "## Docker Build Report" >> $GITHUB_STEP_SUMMARY
        echo "- **Image Tag:** nodeapp:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
