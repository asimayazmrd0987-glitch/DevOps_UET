name: Week 3 Python Docker CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Week_3-main/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Week_3-main/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Validate Python syntax
      run: |
        cd Week_3-main
        python -m py_compile app.py
        echo "✓ Python syntax is valid"
        
    - name: Run Python script
      run: |
        cd Week_3-main
        python app.py
        
    - name: Check code quality with Flake8
      run: |
        pip install flake8
        cd Week_3-main
        flake8 app.py --max-line-length=120 --ignore=E501,W503 || echo "Linting completed"
        
    - name: Security check with Bandit
      run: |
        pip install bandit
        cd Week_3-main
        bandit -r app.py || echo "Security check completed"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-week3-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-week3-
          
    - name: Build Docker image
      run: |
        cd Week_3-main
        docker build \
          --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
          --build-arg VCS_REF=${{ github.sha }} \
          -t week3-app:${{ github.sha }} \
          -t week3-app:latest \
          .
          
    - name: Scan Docker image for vulnerabilities
      uses: docker/scout-action@v1
      with:
        command: cves
        image: week3-app:${{ github.sha }}
        only-severities: critical,high
        exit-code: false
        
    - name: Test Docker container
      run: |
        cd Week_3-main
        echo "Running Docker container..."
        docker run --rm week3-app:${{ github.sha }}
        echo "✓ Docker container executed successfully"
        
    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Push Docker image to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cd Week_3-main
        docker tag week3-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/week3-app:${{ github.sha }}
        docker tag week3-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/week3-app:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/week3-app:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/week3-app:latest
        echo "✓ Docker images pushed successfully"
        
    - name: Generate build report
      if: always()
      run: |
        echo "## Week 3 Docker Build Report" >> $GITHUB_STEP_SUMMARY
        echo "- **Image Tag:** week3-app:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- **Python Version:** 3.10" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
